name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  quality:
    name: Quality and Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run project quality gate
        env:
          SECRET_KEY: test-secret-key-for-ci-32-bytes # pragma: allowlist secret
          ENVIRONMENT: testing
          DEBUG: "False"
        run: uv run python tools/dev/check.py --ci

      - name: Build documentation
        run: uv run mkdocs build --clean

  docker-build:
    name: Docker Build Verification
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: site
            dockerfile: deploy/frontend/Dockerfile
          - name: game
            dockerfile: deploy/backend/Dockerfile
          - name: chat
            dockerfile: deploy/chat/Dockerfile
          - name: worker
            dockerfile: deploy/worker/Dockerfile
          - name: nginx
            dockerfile: deploy/nginx/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.image.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          push: false
          tags: tbmmorpg-${{ matrix.image.name }}:ci
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}
