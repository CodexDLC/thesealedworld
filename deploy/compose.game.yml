name: tbmmorpg

services:
  generated-assets-init:
    image: alpine:3.20
    restart: "no"
    command:
      - sh
      - -c
      - >
        mkdir -p /app/var/generated-assets/monsters
        && chown -R 1000:1000 /app/var/generated-assets
        && chmod -R u+rwX,g+rwX /app/var/generated-assets
    volumes:
      - tbmmorpg-generated-assets:/app/var/generated-assets

  backend-migrate:
    image: ${DOCKER_IMAGE_GAME:?DOCKER_IMAGE_GAME is required}
    container_name: tbmmorpg-backend-migrate
    restart: "no"
    env_file:
      - path: ${DEPLOY_ENV_FILE:-.env}
        required: false
    environment:
      DATABASE_URL: ${GAME_DATABASE_URL:?GAME_DATABASE_URL is required}
      SITE_DATABASE_URL: ${SITE_DATABASE_URL:?SITE_DATABASE_URL is required}
      GAME_DATABASE_URL: ${GAME_DATABASE_URL:?GAME_DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      MONGO_URL: ${MONGO_URL:?MONGO_URL is required}
      MONGO_DATABASE: ${MONGO_DATABASE:-tbmmorpg_analytics}
      DEBUG: "False"
    entrypoint:
      - sh
      - -c
      - python src/backend/manage.py upgrade && python src/backend/manage.py ensure-mongo-indexes && python src/backend/manage.py rebuild-monsters --apply
    networks:
      - tbmmorpg-network

  backend:
    image: ${DOCKER_IMAGE_GAME:?DOCKER_IMAGE_GAME is required}
    container_name: tbmmorpg-backend
    restart: unless-stopped
    env_file:
      - path: ${DEPLOY_ENV_FILE:-.env}
        required: false
    environment:
      DATABASE_URL: ${GAME_DATABASE_URL:?GAME_DATABASE_URL is required}
      SITE_DATABASE_URL: ${SITE_DATABASE_URL:?SITE_DATABASE_URL is required}
      GAME_DATABASE_URL: ${GAME_DATABASE_URL:?GAME_DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      MONGO_URL: ${MONGO_URL:?MONGO_URL is required}
      MONGO_DATABASE: ${MONGO_DATABASE:-tbmmorpg_analytics}
      REALTIME_ALLOWED_ORIGINS: ${REALTIME_ALLOWED_ORIGINS}
      DEBUG: "False"
    entrypoint:
      - uvicorn
      - src.backend.app:app
      - --host
      - 0.0.0.0
      - --port
      - "8001"
      - --log-level
      - info
    expose:
      - "8001"
    volumes:
      - tbmmorpg-generated-assets:/app/var/generated-assets
    depends_on:
      generated-assets-init:
        condition: service_completed_successfully
      backend-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - tbmmorpg-network

  chat:
    image: ${DOCKER_IMAGE_CHAT:?DOCKER_IMAGE_CHAT is required}
    container_name: tbmmorpg-chat
    restart: unless-stopped
    env_file:
      - path: ${DEPLOY_ENV_FILE:-.env}
        required: false
    environment:
      DATABASE_URL: ${GAME_DATABASE_URL:?GAME_DATABASE_URL is required}
      SITE_DATABASE_URL: ${SITE_DATABASE_URL:?SITE_DATABASE_URL is required}
      GAME_DATABASE_URL: ${GAME_DATABASE_URL:?GAME_DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      MONGO_URL: ${MONGO_URL:?MONGO_URL is required}
      MONGO_DATABASE: ${MONGO_DATABASE:-tbmmorpg_analytics}
      STREAM_CONSUMER_GROUP: ${CHAT_STREAM_CONSUMER_GROUP:-chat}
      WORKER_NAME: ${CHAT_WORKER_NAME:-chat_worker_1}
      REALTIME_ALLOWED_ORIGINS: ${REALTIME_ALLOWED_ORIGINS}
      DEBUG: "False"
    command:
      - uvicorn
      - src.backend.chat.app:app
      - --host
      - 0.0.0.0
      - --port
      - "8002"
      - --log-level
      - info
    expose:
      - "8002"
    depends_on:
      backend-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - tbmmorpg-network

  chat-archive-worker:
    image: ${DOCKER_IMAGE_WORKER:?DOCKER_IMAGE_WORKER is required}
    restart: unless-stopped
    env_file:
      - path: ${DEPLOY_ENV_FILE:-.env}
        required: false
    environment:
      DATABASE_URL: ${GAME_DATABASE_URL:?GAME_DATABASE_URL is required}
      SITE_DATABASE_URL: ${SITE_DATABASE_URL:?SITE_DATABASE_URL is required}
      GAME_DATABASE_URL: ${GAME_DATABASE_URL:?GAME_DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      MONGO_URL: ${MONGO_URL:?MONGO_URL is required}
      MONGO_DATABASE: ${MONGO_DATABASE:-tbmmorpg_analytics}
      DEBUG: "False"
    command: ["arq", "src.backend.chat.workers.archive.ChatArchiveWorkerSettings"]
    depends_on:
      backend-migrate:
        condition: service_completed_successfully
    networks:
      - tbmmorpg-network

  combat-worker:
    image: ${DOCKER_IMAGE_WORKER:?DOCKER_IMAGE_WORKER is required}
    restart: unless-stopped
    env_file:
      - path: ${DEPLOY_ENV_FILE:-.env}
        required: false
    environment:
      DATABASE_URL: ${GAME_DATABASE_URL:?GAME_DATABASE_URL is required}
      SITE_DATABASE_URL: ${SITE_DATABASE_URL:?SITE_DATABASE_URL is required}
      GAME_DATABASE_URL: ${GAME_DATABASE_URL:?GAME_DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      MONGO_URL: ${MONGO_URL:?MONGO_URL is required}
      MONGO_DATABASE: ${MONGO_DATABASE:-tbmmorpg_analytics}
      DEBUG: "False"
    command: ["arq", "src.backend.features.combat.workers.arq.CombatArqSettings"]
    depends_on:
      backend-migrate:
        condition: service_completed_successfully
    networks:
      - tbmmorpg-network

  combat-ai-simulation-worker:
    image: ${DOCKER_IMAGE_WORKER:?DOCKER_IMAGE_WORKER is required}
    restart: unless-stopped
    profiles:
      - combat-ai-simulation
    env_file:
      - path: ${DEPLOY_ENV_FILE:-.env}
        required: false
    environment:
      DATABASE_URL: ${GAME_DATABASE_URL:?GAME_DATABASE_URL is required}
      SITE_DATABASE_URL: ${SITE_DATABASE_URL:?SITE_DATABASE_URL is required}
      GAME_DATABASE_URL: ${GAME_DATABASE_URL:?GAME_DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      MONGO_URL: ${MONGO_URL:?MONGO_URL is required}
      MONGO_DATABASE: ${MONGO_DATABASE:-tbmmorpg_analytics}
      DEBUG: "False"
    command: ["arq", "src.backend.features.combat.workers.ai_simulation_arq.CombatAiSimulationArqSettings"]
    depends_on:
      backend-migrate:
        condition: service_completed_successfully
    networks:
      - tbmmorpg-network

  system-worker:
    image: ${DOCKER_IMAGE_WORKER:?DOCKER_IMAGE_WORKER is required}
    restart: unless-stopped
    env_file:
      - path: ${DEPLOY_ENV_FILE:-.env}
        required: false
    environment:
      DATABASE_URL: ${GAME_DATABASE_URL:?GAME_DATABASE_URL is required}
      SITE_DATABASE_URL: ${SITE_DATABASE_URL:?SITE_DATABASE_URL is required}
      GAME_DATABASE_URL: ${GAME_DATABASE_URL:?GAME_DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      MONGO_URL: ${MONGO_URL:?MONGO_URL is required}
      MONGO_DATABASE: ${MONGO_DATABASE:-tbmmorpg_analytics}
      DEBUG: "False"
    command: ["arq", "src.backend.features.system.workers.arq.SystemArqSettings"]
    depends_on:
      backend-migrate:
        condition: service_completed_successfully
    networks:
      - tbmmorpg-network

  generation-ai-worker:
    image: ${DOCKER_IMAGE_WORKER:?DOCKER_IMAGE_WORKER is required}
    restart: unless-stopped
    env_file:
      - path: ${DEPLOY_ENV_FILE:-.env}
        required: false
    environment:
      DATABASE_URL: ${GAME_DATABASE_URL:?GAME_DATABASE_URL is required}
      SITE_DATABASE_URL: ${SITE_DATABASE_URL:?SITE_DATABASE_URL is required}
      GAME_DATABASE_URL: ${GAME_DATABASE_URL:?GAME_DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      MONGO_URL: ${MONGO_URL:?MONGO_URL is required}
      MONGO_DATABASE: ${MONGO_DATABASE:-tbmmorpg_analytics}
      DEBUG: "False"
    command: ["arq", "src.backend.features.generation_ai.workers.arq.GenerationAIArqSettings"]
    volumes:
      - tbmmorpg-generated-assets:/app/var/generated-assets
    depends_on:
      generated-assets-init:
        condition: service_completed_successfully
      backend-migrate:
        condition: service_completed_successfully
    networks:
      - tbmmorpg-network

volumes:
  tbmmorpg-generated-assets:
    name: tbmmorpg-generated-assets

networks:
  tbmmorpg-network:
    name: tbmmorpg-network
    driver: bridge
