services:
  nginx-test:
    build:
      context: ..
      dockerfile: deploy/nginx/Dockerfile
    container_name: tbmmorpg-nginx-test
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/site-nginx-test.conf:/etc/templates/site.conf.template:ro
    environment:
      DOMAIN_NAME: localhost
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_started
      chat:
        condition: service_started
    networks:
      - tbmmorpg-network
