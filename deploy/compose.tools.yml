name: tbmmorpg

services:
  cloudbeaver:
    image: dbeaver/cloudbeaver:latest
    container_name: tbmmorpg-cloudbeaver
    restart: unless-stopped
    ports:
      - "127.0.0.1:8978:8978"
    volumes:
      - tbmmorpg-cloudbeaver-workspace:/opt/cloudbeaver/workspace
    networks:
      - tbmmorpg-network

  redisinsight-data-init:
    image: alpine:3.20
    restart: "no"
    command: ["sh", "-c", "chown -R 1000:1000 /data && chmod -R u+rwX,g+rwX /data"]
    volumes:
      - tbmmorpg-redisinsight-data:/data

  redisinsight:
    image: redis/redisinsight:latest
    container_name: tbmmorpg-redisinsight
    restart: unless-stopped
    ports:
      - "127.0.0.1:5540:5540"
    volumes:
      - tbmmorpg-redisinsight-data:/data
    depends_on:
      redisinsight-data-init:
        condition: service_completed_successfully
    networks:
      - tbmmorpg-network

volumes:
  tbmmorpg-cloudbeaver-workspace:
    name: tbmmorpg-cloudbeaver-workspace
  tbmmorpg-redisinsight-data:
    name: tbmmorpg-redisinsight-data

networks:
  tbmmorpg-network:
    name: tbmmorpg-network
    external: true
