services:
  postgres:
    image: postgres:17-alpine
    container_name: tbmmorpg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tbmmorpg
      POSTGRES_PASSWORD: tbmmorpg_dev
      POSTGRES_DB: tbmmorpg_site
    ports:
      - "5432:5432"
    volumes:
      - tbmmorpg-postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tbmmorpg -d tbmmorpg_site"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  tbmmorpg-postgres-data:
