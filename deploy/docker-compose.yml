  #     - backend
  #     - frontend
  #   networks:
  #     - tbmmorpg-network

volumes:
  tbmmorpg-postgres-data:
  tbmmorpg-redis-data:
  tbmmorpg-mongo-data:

networks:
  tbmmorpg-network:
    driver: bridge
