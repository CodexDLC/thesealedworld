  #   ports:
  #     - "80:80"
  #   depends_on:
  #     - backend
  #     - frontend
  #   networks:
  #     - tbmmorpg-network

volumes:
  tbmmorpg-postgres-data:
  tbmmorpg-redis-data:

networks:
  tbmmorpg-network:
    driver: bridge
