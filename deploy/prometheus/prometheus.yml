global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "backend"
    static_configs:
      - targets: ["backend:8001"]

  - job_name: "frontend"
    static_configs:
      - targets: ["frontend:8000"]

  - job_name: "chat"
    static_configs:
      - targets: ["chat:8002"]
