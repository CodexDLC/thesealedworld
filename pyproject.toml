[build-system]
requires = ["hatchling>=1.27", "hatch-vcs>=0.5"]
build-backend = "hatchling.build"

[project]
name = "thesealedworld"
dynamic = ["version"]
description = "Turn-Based MMORPG with FastAPI and HTMX"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.4",
    "aiosqlite>=0.22.0",
    "asyncpg>=0.31.0",
    "codex-core>=0.4.0",
    "codex-platform>=0.5.2",
    "fastapi>=0.136.1",
    "loguru>=0.7.3",
    "prometheus-client>=0.25.0",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.0",
    "redis>=5.0,<6",
    "rich>=13.9.4",
    "sqlalchemy>=2.0.49",
    "uvicorn>=0.46.0",
    "authx==1.6.0",
    "mako>=1.3.12",
    "urllib3>=2.7.0",
]

[tool.uv]
default-groups = ["dev", "backend-runtime", "frontend-runtime", "tg-bot"]


[tool.hatch.version]
source = "vcs"
raw-options = { fallback_version = "0.0.0", version_scheme = "guess-next-dev", local_scheme = "no-local-version" }

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
backend-runtime = [
    "arq>=0.26.3",
    "boto3>=1.35.0",
    "google-genai>=0.3.0",
    "codex-ai[gemini]==0.2.4",
    "pillow>=12.0.0",
    "pymongo>=4.13",
]
docs = [
    "mkdocs==1.6.1",
    "mkdocs-material==9.5.49",
    "mkdocstrings[python]==0.27.0",
]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "pre-commit",
    "pip-audit",
    "bandit[toml]",
    "djlint>=1.36.4",
    "graphifyy>=0.5.4",
]
frontend-runtime = [
    "aiosmtplib>=3.0.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.20",
]
tg-bot = [
    "aiogram>=3.0",
    "codex-bot>=0.3.0",
]


# === Ruff ===
[tool.ruff]
target-version = "py313"
line-length = 120
src = ["src"]
exclude = ["archive", "tests", "tools", "temp"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "TCH"]
ignore = ["E501", "B008", "TC002", "TC003"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

# === Mypy ===
[tool.mypy]
python_version = "3.13"
strict = false
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false
disable_error_code = ["call-arg"]
explicit_package_bases = true
exclude = ["src/backend/alembic/"]

[[tool.mypy.overrides]]
module = [
    "src.backend.features.combat.runtime.services.durability_policy",
    "src.frontend.game_features.session.view_models.nav",
    "src.backend.features.combat.runtime.support.analytics_builder",
    "src.backend.features.game_catalog.combat.resources.text_templates.definitions",
    "src.backend.features.world.prompts.router",
    "src.backend.features.monsters.prompts.router",
    "src.backend.features.items.prompts.router",
    "src.backend.core.ai",
    "src.backend.infrastructure.combat.repositories.analytics_repository",
    "src.backend.features.generation_ai.integrations.codex_ai_executor",
    "src.backend.features.scenario.handlers.tutorial_handler",
    "src.backend.features.scenario.handlers.dialogue_handler",
    "src.backend.features.combat.runtime.analytics.ingestion",
    "src.backend.features.expedition.service",
    "src.backend.features.monsters.services.anchor_projection_bootstrap",
    "tools.monsters.backfill_gear_score",
    "src.backend.features.monsters.services.generated_view_service",
    "src.backend.features.game_catalog.services.catalog_service",
    "src.backend.features.combat.integrations.session_integration",
    "src.backend.features.loot.services.loot_service",
    "src.backend.features.combat.services.post_battle_router",
    "src.backend.features.exploration.services.navigation_service",
    "src.backend.features.combat.workers.tasks.victory_finalizer_task",
    "src.backend.features.monsters.services.monster_group_service",
    "src.backend.features.combat.services.view_service",
    "src.backend.features.combat.services.analytics_dashboard_service",
    "src.backend.features.combat.runtime.support.log_builder",
    "src.backend.features.combat.runtime.processors.chaos_service",
    "src.backend.features.combat.runtime.engine.resolver",
    "src.backend.features.city_services.services",
    "tools.world_static_audit",
    "src.backend.features.arena.services.arena_service",
    "src.backend.features.game_session.dependencies",
    "src.frontend.features.auth.repositories.user_repository",
    "src.frontend.features.feedback.routes.pages",
]
ignore_errors = true

# === Pytest ===
[tool.pytest.ini_options]
asyncio_mode = "auto"
log_cli = true
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = [".", "src"]
markers = [
    "unit: Unit tests (fast, isolated)",
    "integration: Integration tests",
]
addopts = "-v --tb=short --cov=src --cov-report=term-missing"

# === Coverage ===
[tool.coverage.run]
source = ["src"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/conftest.py",
]

[tool.coverage.report]
fail_under = 74
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

# === Bandit ===
[tool.bandit]
exclude_dirs = ["tests", "tools"]
targets = ["src"]
skips = ["B101", "B308", "B703", "B311", "B110"]

# === Quality Gate ===
[tool.codex-check]
project-name = "thesealedworld"
quality-command = "uv run pre-commit run --all-files"
types-command = "uv run mypy --explicit-package-bases src tools"
test-command = "uv run pytest"
security-command = "uv run pip-audit --skip-editable --ignore-vuln CVE-2026-3219 --ignore-vuln CVE-2026-6357 --ignore-vuln CVE-2026-45409 --ignore-vuln PYSEC-2025-183 --ignore-vuln PYSEC-2026-89 --ignore-vuln PYSEC-2026-196 --ignore-vuln CVE-2026-34993 --ignore-vuln CVE-2026-47265"
audit-flags = "--skip-editable --ignore-vuln CVE-2026-3219 --ignore-vuln CVE-2026-6357 --ignore-vuln CVE-2026-45409 --ignore-vuln PYSEC-2025-183 --ignore-vuln PYSEC-2026-89 --ignore-vuln PYSEC-2026-196 --ignore-vuln CVE-2026-34993 --ignore-vuln CVE-2026-47265"
test-stages = ["unit"]
test-paths = ["tests"]
types-paths = ["src", "tools"]
no-cov-test-stages = []
live-output-test-stages = ["unit"]
test-markers = { unit = "" }

# === djLint ===
[tool.djlint]
profile = "jinja"
indent = 4
line_length = 120
blank_line_after_tag = "load,extends,include"
close_void_tags = true
format_css = true
format_js = true
# H006: img should have alt (demo data doesn't always have it)
# H030/H031: script/style tag should have type (optional in HTML5)
# D018/D017: Django specific URL tags (we use Jinja2)
ignore = "H006,H030,H031,D018,D017"
