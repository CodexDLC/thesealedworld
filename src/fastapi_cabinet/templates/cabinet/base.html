<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>{{ layout.title }}</title>
        <link rel="stylesheet" href="{{ layout.static_mount_path }}/css/cabinet.css?v={{ layout.static_version }}">
        {% block extra_head %}{% endblock %}
    </head>
    <body class="fc-shell">
        <aside class="fc-sidebar-col">
            <a class="fc-brand" href="{{ layout.mount_path }}">
                <span class="fc-brand__icon">⬡</span>
                <span class="fc-brand__label">Cabinet</span>
            </a>
            {% include "cabinet/includes/sidebar.html" %}
        </aside>
        <div class="fc-main-col">
            {% include "cabinet/includes/topbar.html" %}
            <main class="fc-content">
                {% block content %}{% endblock %}
            </main>
        </div>
        <script src="{{ layout.static_mount_path }}/js/cabinet.js?v={{ layout.static_version }}"></script>
    </body>
</html>
