<nav class="fc-sidebar-nav" aria-label="Module sections">
    {% if layout.sidebar %}
        {% if layout.active_module %}
            <p class="fc-sidebar-section">{{ layout.title }}</p>
        {% endif %}
        {% for item in layout.sidebar %}
            <a class="fc-sidebar-item{% if item.path == layout.active_path %} is-active{% endif %}"
               href="{{ item.path }}">
                <span>{{ item.label }}</span>
                {% if item.badge_key and item.badge_key in layout.sidebar_badges %}
                    <strong class="fc-sidebar-badge">{{ layout.sidebar_badges[item.badge_key] }}</strong>
                {% endif %}
            </a>
        {% endfor %}
    {% endif %}
</nav>
