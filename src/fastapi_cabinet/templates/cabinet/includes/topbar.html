<header class="fc-topbar">
    <nav class="fc-topbar-nav" aria-label="Cabinet sections">
        {% for group in layout.header_groups %}
            <div class="fc-nav-group">
                <button class="fc-nav-group__trigger" type="button">
                    {{ group.label }}<span class="fc-nav-group__arrow">▾</span>
                </button>
                <div class="fc-nav-group__menu">
                    {% for item in group.items %}
                        <a class="fc-nav-group__item{% if item.key == layout.active_module %} is-active{% endif %}"
                           href="{{ item.path }}">{{ item.label }}</a>
                    {% endfor %}
                </div>
            </div>
        {% endfor %}
    </nav>
</header>
