{% extends "cabinet/base.html" %}

{% block content %}
    {% if widgets %}
        <div class="fc-widgets">
            {% for widget in widgets %}
                {% include "cabinet/widgets/" ~ widget.kind ~ ".html" %}
            {% endfor %}
        </div>
    {% else %}
        <p class="fc-empty">Данные появятся позже.</p>
    {% endif %}
{% endblock %}
