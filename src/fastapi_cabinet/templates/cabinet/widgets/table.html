{% extends "cabinet/includes/widget_frame.html" %}

{% block widget_content %}
    <table>
        <thead>
            <tr>
                {% for column in widget.columns %}<th>{{ column.label }}</th>{% endfor %}
            </tr>
        </thead>
        <tbody>
            {% for row in widget.rows %}
                <tr>
                    {% for column in widget.columns %}<td>{{ row[column.key] }}</td>{% endfor %}
                </tr>
            {% endfor %}
        </tbody>
    </table>
{% endblock %}
