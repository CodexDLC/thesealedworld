<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #0a0a0c; color: #c8b89a; margin: 0; padding: 0; }
  .email-wrap { max-width: 560px; margin: 0 auto; padding: 32px 24px; }
  .email-header { border-bottom: 1px solid rgba(255,170,0,0.15); padding-bottom: 16px; margin-bottom: 24px; }
  .email-logo { color: #ffaa00; font-size: 18px; letter-spacing: 0.08em; text-transform: uppercase; text-decoration: none; }
  .email-body { line-height: 1.7; font-size: 15px; }
  .email-footer { margin-top: 32px; padding-top: 16px; border-top: 1px solid rgba(255,170,0,0.08); font-size: 12px; color: #666; }
</style>
</head>
<body>
<div class="email-wrap">
  <div class="email-header">
    <span class="email-logo">The Sealed World</span>
  </div>
  <div class="email-body">
    {% block body %}{% endblock %}
  </div>
  <div class="email-footer">
    The Sealed World &mdash; Turn-Based MMORPG
  </div>
</div>
</body>
</html>
