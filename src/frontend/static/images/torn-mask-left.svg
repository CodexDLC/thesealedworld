<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 1000" preserveAspectRatio="none">
  <defs>
    <!-- Gradient starts at 320px out of 340px total — only the last 20px is the torn zone -->
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="340" y2="0">
      <stop offset="94%" stop-color="white"/>
      <stop offset="100%" stop-color="black"/>
    </linearGradient>
    <filter id="f" x="-5%" y="-2%" width="115%" height="104%">
      <feTurbulence type="fractalNoise" baseFrequency="0.015 0.07" numOctaves="4" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="15" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <rect width="340" height="1000" fill="url(#g)" filter="url(#f)"/>
</svg>
