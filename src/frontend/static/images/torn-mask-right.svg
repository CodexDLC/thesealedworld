<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 1000" preserveAspectRatio="none">
  <defs>
    <!-- First 20px of 340px is the torn zone — rest is fully visible content -->
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="340" y2="0">
      <stop offset="0%" stop-color="black"/>
      <stop offset="6%" stop-color="white"/>
    </linearGradient>
    <filter id="f" x="-15%" y="-2%" width="120%" height="104%">
      <feTurbulence type="fractalNoise" baseFrequency="0.015 0.07" numOctaves="4" seed="11" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="15" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <rect width="340" height="1000" fill="url(#g)" filter="url(#f)"/>
</svg>
