<div class="status-section" style="margin-top: 0; margin-bottom: 20px;">
    <div class="stat-row">
        <div class="stat-label-row">
            <span class="stat-key">HP</span>
            <span class="stat-val"><span x-text="agents[selectedAgentId].hp">67</span> / <span x-text="agents[selectedAgentId].max_hp">100</span></span>
        </div>
        <div class="stat-track">
            <div class="stat-fill hp" :style="`width: ${(agents[selectedAgentId].hp / agents[selectedAgentId].max_hp) * 100}%` "></div>
        </div>
    </div>

    <div class="stat-row" style="margin-top: 8px;">
        <div class="stat-label-row">
            <span class="stat-key">EN</span>
            <span class="stat-val"><span x-text="agents[selectedAgentId].energy">82</span> / <span x-text="agents[selectedAgentId].max_energy">100</span></span>
        </div>
        <div class="stat-track">
            <div class="stat-fill en" :style="`width: ${(agents[selectedAgentId].energy / agents[selectedAgentId].max_energy) * 100}%` "></div>
        </div>
    </div>

    <div class="stat-row" style="margin-top: 8px;">
        <div class="stat-label-row">
            <span class="stat-key">CONC</span>
            <span class="stat-val"><span x-text="agents[selectedAgentId].stamina">55</span> / <span x-text="agents[selectedAgentId].max_stamina">100</span></span>
        </div>
        <div class="stat-track">
            <div class="stat-fill sta" :style="`width: ${(agents[selectedAgentId].stamina / agents[selectedAgentId].max_stamina) * 100}%` "></div>
        </div>
    </div>
</div>
