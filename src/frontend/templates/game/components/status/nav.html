<nav class="dock-nav dock-nav--bar dock-nav--panel status-dock-actions" aria-label="{{ status_nav_label if status_nav_label is defined else 'Status actions' }}">
    <button class="dock-nav-button"
            type="button"
            @click="leftPanelView = 'status'"
            :class="{ 'is-active': leftPanelView === 'status' }">STATUS</button>
    <button class="dock-nav-button"
            type="button"
            @click="leftPanelView = 'builds'"
            :class="{ 'is-active': leftPanelView === 'builds' }">BUILD</button>
    {% if char_id is defined and char_id %}
    <button class="dock-nav-button"
            type="button"
            hx-get="/game/character-status/panel?char_id={{ char_id }}"
            hx-target="#status-container"
            hx-swap="outerHTML"
            data-tippy-content="Запросить свежие HP, EN, CONC и текущие параметры персонажа."
            data-tippy-theme="game-hint">SYNC</button>
    {% endif %}
    <button class="dock-nav-button dock-nav-button--close"
            type="button"
            @click="$dispatch('panel-toggle', { side: 'left', view: '{{ status_nav_close_view if status_nav_close_view is defined else 'status' }}' })">CLOSE</button>
</nav>
