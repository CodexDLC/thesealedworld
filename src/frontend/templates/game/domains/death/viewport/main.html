<section class="death-screen" aria-label="Death state">
    <div class="mobile-encounter-interrupt death-screen-panel">
        <header>
            <span>EXPEDITION FAILED</span>
        </header>
        <strong>Вы погибли</strong>
        <p>Поход оборвался. Можно воскреснуть у портала и начать восстановление.</p>
        <form hx-post="{{ death.respawn_action if death else '/game/death/respawn' }}"
              hx-target="#game-session-root"
              hx-swap="outerHTML"
              class="death-screen-actions">
            <input type="hidden" name="char_id" value="{{ char_id }}">
            <button type="submit"
                    class="dp game-action-button mobile-action mobile-encounter-action mobile-encounter-action--escape death-respawn-action"
                    data-tippy-content="Все найденное во время похода будет утеряно."
                    data-tippy-theme="game-hint">
                <strong>Воскреснуть у портала</strong>
                <span>Завершить поход</span>
            </button>
        </form>
    </div>
</section>
