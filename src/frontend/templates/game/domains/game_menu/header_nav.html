<nav class="center-nav">
    {% if nav and nav.l2 %}
    <button class="cnav-btn" @click="window.location='{{ nav.l2.url }}'" :class="{'active': {{ 'true' if nav.l2.is_active else 'false' }}}">
        <svg viewBox="0 0 24 24"><path d="M12 2a5 5 0 1 1 0 10A5 5 0 0 1 12 2zm0 12c5.33 0 8 2.67 8 4v2H4v-2c0-1.33 2.67-4 8-4z"/></svg>
        <span>{{ nav.l2.label }}</span>
    </button>
    {% else %}
        <div class="cnav-spacer"></div>
    {% endif %}

    {% if nav and nav.l1 %}
    <button class="cnav-btn" @click="window.location='{{ nav.l1.url }}'" :class="{'active': {{ 'true' if nav.l1.is_active else 'false' }}}">
        <svg viewBox="0 0 24 24"><path d="M19 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm-7 3a3 3 0 1 1 0 6 3 3 0 0 1 0-6zm6 13H6v-.5c0-2 4-3.1 6-3.1s6 1.1 6 3.1V19z"/></svg>
        <span>{{ nav.l1.label }}</span>
    </button>
    {% else %}
        <div class="cnav-spacer"></div>
    {% endif %}

    {% if nav and nav.center %}
    <button class="cnav-btn cnav-btn--explore {{ 'active' if nav.center.is_active else '' }}"
            {% if nav.center.url and nav.center.url != '#' %}@click="window.location='{{ nav.center.url }}'"{% endif %}>
        <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span>{{ nav.center.label }}</span>
    </button>
    {% else %}
    <button class="cnav-btn cnav-btn--explore">
        <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>
        <span>UNKNOWN</span>
    </button>
    {% endif %}

    {% if nav and nav.r1 %}
    <button class="cnav-btn" @click="window.location='{{ nav.r1.url }}'" :class="{'active': {{ 'true' if nav.r1.is_active else 'false' }}}">
        <svg viewBox="0 0 24 24"><path d="M13 2v8h8V2h-8zm6 6h-4V4h4v4zm-6 4v8h8v-8h-8zm6 6h-4v-4h4v4zM2 2v8h8V2H2zm6 6H4V4h4v4zm-6 4v8h8v-8H2zm6 6H4v-4h4v4z"/></svg>
        <span>{{ nav.r1.label }}</span>
    </button>
    {% else %}
        <div class="cnav-spacer"></div>
    {% endif %}

    {% if nav and nav.r2 %}
    <button class="cnav-btn" @click="window.location='{{ nav.r2.url }}'" :class="{'active': {{ 'true' if nav.r2.is_active else 'false' }}}">
        <svg viewBox="0 0 24 24"><path d="M20 6h-2.18c.07-.44.18-.87.18-1.33C18 2.54 15.96.5 13.5.5c-1.27 0-2.4.55-3.2 1.42L9 3.25l-1.3-1.33A4.49 4.49 0 0 0 4.5.5C2.04.5 0 2.54 0 4.67c0 .46.1.89.18 1.33H0v13a2 2 0 0 0 2 2h18a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2zM9 17H7v-2h2v2zm0-4H7v-2h2v2zm4 4h-2v-2h2v2zm0-4h-2v-2h2v2zm4 4h-2v-2h2v2zm0-4h-2v-2h2v2z"/></svg>
        <span>{{ nav.r2.label }}</span>
    </button>
    {% else %}
        <div class="cnav-spacer"></div>
    {% endif %}
</nav>
