<article class="scenario-panel">
    <header class="scenario-panel-head">
        <span>awakening_rift</span>
        <span>finalized</span>
    </header>

    <div class="scenario-panel-body">
        <div class="scenario-copy">
            Сценарий завершен. Переход в режим путешествия подготовлен.
        </div>

        <div class="scenario-actions">
            <a class="btn-node scenario-action"
               href="/game/session/state/{{ next_domain or 'EXPLORATION' }}?char_id={{ char_id }}">
                <span>Перейти к игровому интерфейсу</span>
            </a>
        </div>
    </div>
</article>
