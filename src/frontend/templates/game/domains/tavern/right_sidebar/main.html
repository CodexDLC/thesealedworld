<aside class="panel-dock panel-dock--framed panel-dock--scroll tavern-info-dock"
       aria-label="Tavern context dock">
    <nav class="dock-nav dock-nav--bar dock-nav--panel tavern-info-actions" aria-label="Tavern info actions">
        <button class="dock-nav-button is-active" type="button">INFO</button>
        <button class="dock-nav-button dock-nav-button--close"
                type="button"
                @click="$dispatch('panel-toggle', { side: 'right', view: 'context' })">CLOSE</button>
    </nav>

    {% if tavern %}
        <section class="info-widget-section tavern-info-section" aria-label="Tavern identity">
            <header class="info-widget-title">
                <span>TAVERN CONTEXT</span>
                <strong>{{ tavern.tavern_id }}</strong>
            </header>
            <div class="info-widget-list info-widget-kv">
                <div><span>Tavern</span><strong>{{ tavern.tavern_id }}</strong></div>
                <div><span>Location</span><strong>{{ tavern.location_id or 'NO_LOCATION' }}</strong></div>
            </div>
        </section>
    {% else %}
        <section class="info-widget-section tavern-info-section">
            <header class="info-widget-title">
                <span>TAVERN CONTEXT</span>
                <strong>NO_DATA</strong>
            </header>
        </section>
    {% endif %}
</aside>
