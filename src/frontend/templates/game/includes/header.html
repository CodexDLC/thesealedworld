<div class="header-left">
    <div class="game-brand" aria-label="The Sealed World">
        <div class="game-logo">The Sealed World</div>
    </div>
    {% if world_resonance %}
    <div class="resonance-tag">
        WORLD_RESONANCE // {{ world_resonance }}
    </div>
    {% endif %}
</div>

<div class="header-center">
</div>

<div class="header-right">
    <button type="button"
            class="game-chat-toggle"
            @click="toggleChatOverlay()"
            :class="{ 'has-unread': chatUnread, 'is-open': !chatClosed }"
            :aria-expanded="(!chatClosed).toString()"
            aria-controls="game-chat-container"
            aria-label="Toggle chat">
        <span class="game-chat-toggle-glyph" aria-hidden="true"></span>
        <span class="game-chat-toggle-text">Chat</span>
    </button>
    <div class="game-system-menu" x-data="{ open: false }" @keydown.escape="open = false" @click.outside="open = false">
        <button type="button"
                class="game-system-menu-toggle"
                @click="open = !open"
                :aria-expanded="open.toString()"
                aria-haspopup="menu"
                aria-label="Open system menu">
            <span class="game-system-menu-glyph" aria-hidden="true"></span>
        </button>
        <nav class="game-system-actions"
             :class="{ 'is-open': open }"
             role="menu"
             aria-label="System menu">
            <a class="game-system-action"
               href="/account"
               target="_blank"
               rel="noopener"
               role="menuitem"
               aria-label="Open account in a separate window">
                <span class="game-system-action-glyph game-system-action-glyph--cabinet" aria-hidden="true"></span>
                <span>Account</span>
            </a>
            {% if user and user.is_superuser %}
            <a class="game-system-action"
               href="/admin"
               target="_blank"
               rel="noopener"
               role="menuitem"
               aria-label="Open admin panel">
                <span class="game-system-action-glyph game-system-action-glyph--settings" aria-hidden="true"></span>
                <span>Admin</span>
            </a>
            {% endif %}
            <form class="game-system-form" action="/game-lobby/release" method="post" role="none">
                {% include "site/includes/csrf_field.html" %}
                <button class="game-system-action"
                        type="submit"
                        data-session-cleanup="pending"
                        role="menuitem"
                        aria-label="Restart session and return to game lobby">
                    <span class="game-system-action-glyph game-system-action-glyph--restart" aria-hidden="true"></span>
                    <span>Restart</span>
                </button>
            </form>
            <button class="game-system-action game-system-action--icon is-disabled"
                    type="button"
                    disabled
                    aria-label="Settings"
                    aria-disabled="true"
                    role="menuitem">
                <span class="game-system-action-glyph game-system-action-glyph--settings" aria-hidden="true"></span>
                <span class="sr-only">Settings</span>
            </button>
        </nav>
    </div>
</div>
