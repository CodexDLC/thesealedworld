    <div class="header-left">
        <div class="game-brand" aria-label="SYMB MMO">
            <div class="game-logo">SYMB_MMO <span class="v-tag">v0.1.0</span></div>
        </div>
        {% if world_resonance %}
        <div class="resonance-tag">
            WORLD_RESONANCE // {{ world_resonance }}
        </div>
        {% endif %}
    </div>

    <div class="header-center">
        {% include "game/domains/game_menu/header_nav.html" %}
    </div>

    <div class="header-right">
        <div class="game-account" x-data="{ open: false }" @keydown.escape="open = false" @click.outside="open = false">
            <button type="button"
                    class="game-account-button"
                    @click="open = !open"
                    :aria-expanded="open.toString()"
                aria-haspopup="menu"
                aria-label="Open account and session menu">
                <span class="game-account-glyph" aria-hidden="true">U</span>
                <span class="game-account-label">ACCOUNT</span>
            </button>
            <div class="game-account-menu"
                 x-show="open"
                 x-cloak
                 x-transition:enter.duration.150ms
                 x-transition:leave.duration.100ms
                 role="menu">
                <a class="game-account-item" href="/cabinet" role="menuitem">Cabinet</a>
                {% if domain == 'combats' %}
                <div class="game-account-item is-disabled" aria-disabled="true" role="menuitem">
                    <span>Lobby</span>
                    <small>LOCKED</small>
                </div>
                {% else %}
                <form class="game-account-exit-form" action="/game-lobby/release" method="post" role="none">
                    <button class="game-exit-link"
                            type="submit"
                            data-session-cleanup="pending"
                            role="menuitem"
                            aria-label="Save session and return to game lobby">
                        <span>Lobby</span>
                        <small>SAVE</small>
                    </button>
                </form>
                {% endif %}
                <div class="game-account-item is-disabled" aria-disabled="true" role="menuitem">
                    <span>Settings</span>
                    <small>SOON</small>
                </div>
            </div>
        </div>
    </div>
