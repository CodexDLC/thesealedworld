{% set win_name = window_name|default('inventory') %}
<div class="hud-window-resize-handles" aria-hidden="true">
    <span class="hud-window-resize-handle hud-window-resize-handle--n"
          @pointerdown.prevent.stop="startHudWindowResize('{{ win_name }}', 'n', $event, $el.closest('.hud-window'))"></span>
    <span class="hud-window-resize-handle hud-window-resize-handle--e"
          @pointerdown.prevent.stop="startHudWindowResize('{{ win_name }}', 'e', $event, $el.closest('.hud-window'))"></span>
    <span class="hud-window-resize-handle hud-window-resize-handle--s"
          @pointerdown.prevent.stop="startHudWindowResize('{{ win_name }}', 's', $event, $el.closest('.hud-window'))"></span>
    <span class="hud-window-resize-handle hud-window-resize-handle--w"
          @pointerdown.prevent.stop="startHudWindowResize('{{ win_name }}', 'w', $event, $el.closest('.hud-window'))"></span>
    <span class="hud-window-resize-handle hud-window-resize-handle--ne"
          @pointerdown.prevent.stop="startHudWindowResize('{{ win_name }}', 'ne', $event, $el.closest('.hud-window'))"></span>
    <span class="hud-window-resize-handle hud-window-resize-handle--se"
          @pointerdown.prevent.stop="startHudWindowResize('{{ win_name }}', 'se', $event, $el.closest('.hud-window'))"></span>
    <span class="hud-window-resize-handle hud-window-resize-handle--sw"
          @pointerdown.prevent.stop="startHudWindowResize('{{ win_name }}', 'sw', $event, $el.closest('.hud-window'))"></span>
    <span class="hud-window-resize-handle hud-window-resize-handle--nw"
          @pointerdown.prevent.stop="startHudWindowResize('{{ win_name }}', 'nw', $event, $el.closest('.hud-window'))"></span>
</div>
