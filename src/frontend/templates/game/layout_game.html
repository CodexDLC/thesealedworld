{% extends "game/base_game.html" %}

{% block body_class %}page-game{% endblock %}

{% block content %}
<div id="app-viewport"
     x-data="{
        tab: 'select',
        chatTab: 'world',
        scene: 'tavern',
        selectedAgentId: 1,
        chatHeight: $persist(200),
        chatMinimized: $persist(false),
        chatStep: $persist(1),
        leftOpen: false,
        rightOpen: false,
        agents: {
            1: {
                active: true,
                name: 'Rook-7', class: 'Archivist', hp: 88, mp: 62, sp: 95,
                loc: 'Sunken Archives', coords: '52_52',
                avatar: '/static/images/avatar.png',
                dust: 1240, shards: 15,
                attributes: {
                    BODY: { Strength: 14, Agility: 11, Endurance: 12 },
                    CORE: { Intellect: 18, Memory: 15, Mental: 16 },
                    SENSOR: { Perception: 13, Projection: 10, Prediction: 9 }
                }
            },
            2: {
                active: true,
                name: 'Veil-4', class: 'Phase-Runner', hp: 45, mp: 92, sp: 40,
                loc: 'Sector 7-B', coords: '12_04',
                avatar: '/static/images/avatars/veil4.png',
                dust: 450, shards: 2,
                attributes: {
                    BODY: { Strength: 10, Agility: 22, Endurance: 11 },
                    CORE: { Intellect: 14, Memory: 12, Mental: 10 },
                    SENSOR: { Perception: 18, Projection: 15, Prediction: 12 }
                }
            }
        }
     }"
     :style="`--chat-height: ${chatMinimized ? '100px' : chatHeight + 'px'}`"
     @panel-toggle.window="
         if ($event.detail.side === 'left') leftOpen = !leftOpen;
         if ($event.detail.side === 'right') rightOpen = !rightOpen;
     ">

    <header class="app-header game-header">
        <div class="header-left">
            <div class="game-logo">SYMB_MMO <span class="v-tag">v0.1.0</span></div>
            <div class="resonance-tag" style="font-family: var(--font-ui); font-size: 8px; color: var(--col-accent); letter-spacing: 0.15em; font-weight: 800; opacity: 0.6; margin-left: 10px; border-left: 1px solid rgba(255,170,0,0.2); padding-left: 10px;">
                WORLD_RESONANCE // 0.1.4_STABLE
            </div>
        </div>

        <div class="header-center">
            <nav class="center-nav">
                <button class="cnav-btn" :class="{ active: leftOpen }" @click="leftOpen = !leftOpen">
                    <svg viewBox="0 0 24 24"><path d="M12 2a5 5 0 1 1 0 10A5 5 0 0 1 12 2zm0 12c5.33 0 8 2.67 8 4v2H4v-2c0-1.33 2.67-4 8-4z"/></svg>
                    <span>CHARACTER</span>
                </button>
                <button class="cnav-btn" :class="{ active: tab === 'character' }" @click="tab = 'character'">
                    <svg viewBox="0 0 24 24"><path d="M19 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm-7 3a3 3 0 1 1 0 6 3 3 0 0 1 0-6zm6 13H6v-.5c0-2 4-3.1 6-3.1s6 1.1 6 3.1V19z"/></svg>
                    <span>ATTRIBUTES</span>
                </button>
                <button class="cnav-btn cnav-btn--explore"
                        :class="{ active: tab === 'game' || tab === 'select' }"
                        @click="tab = (tab === 'select' ? 'select' : 'game')">
                    <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>
                    <span>WORLD</span>
                </button>
                <button class="cnav-btn" :class="{ active: tab === 'abilities' }" @click="tab = 'abilities'">
                    <svg viewBox="0 0 24 24"><path d="M13 2v8h8V2h-8zm6 6h-4V4h4v4zm-6 4v8h8v-8h-8zm6 6h-4v-4h4v4zM2 2v8h8V2H2zm6 6H4V4h4v4zm-6 4v8h8v-8H2zm6 6H4v-4h4v4z"/></svg>
                    <span>ABILITIES</span>
                </button>
                <button class="cnav-btn" :class="{ active: rightOpen }" @click="rightOpen = !rightOpen">
                    <svg viewBox="0 0 24 24"><path d="M20 6h-2.18c.07-.44.18-.87.18-1.33C18 2.54 15.96.5 13.5.5c-1.27 0-2.4.55-3.2 1.42L9 3.25l-1.3-1.33A4.49 4.49 0 0 0 4.5.5C2.04.5 0 2.54 0 4.67c0 .46.1.89.18 1.33H0v13a2 2 0 0 0 2 2h18a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2zM9 17H7v-2h2v2zm0-4H7v-2h2v2zm4 4h-2v-2h2v2zm0-4h-2v-2h2v2zm4 4h-2v-2h2v2zm0-4h-2v-2h2v2z"/></svg>
                    <span>INVENTORY</span>
                </button>
            </nav>
        </div>

        <div class="header-right">
            <div class="server-status">
                <span class="status-label">SERVER:</span>
                <span class="status-value">ONLINE</span>
            </div>
            <div class="connection-stats">
                <div class="status-dot pulse"></div>
                <span class="ping-val">24ms</span>
            </div>
        </div>
    </header>

    <main id="main-content">
        {% block game_content %}{% endblock %}
    </main>

    <footer class="game-footer">
        <div class="footer-copyright">
            <span class="copyright-sym">&copy;</span> 2026 SYMB_MMO. <span class="all-rights">ALL_RIGHTS_RESERVED</span>
        </div>
        <div class="footer-status-log">
            SYSTEM_READY // NO_ERRORS
        </div>
    </footer>

</div>
{% endblock %}
