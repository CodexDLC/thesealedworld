<div class="scene-container" style="height: 100%; width: 100%; position: relative;">
    <!-- We switch screens based on Alpine state or HTMX content -->
    <template x-if="currentScreen === 'select'">
        {% include "game/scene/character_select.html" %}
    </template>

    <template x-if="currentScreen === 'exploration'">
        <div class="exploration-view" style="height: 100%; display: flex; flex-direction: column;">
            <div class="scene-frame" style="flex: 1; background: #000; display: flex; align-items: center; justify-content: center; position: relative;">
                <img src="/static/images/locations/archives_blurred.png" style="max-width: 100%; max-height: 100%; opacity: 0.6;">
                <div style="position: absolute; color: var(--col-accent); font-family: var(--font-mono); font-size: 10px; bottom: 20px;">
                    RENDERING_ENVIRONMENT...
                </div>
            </div>

            <div class="world-info-panel" style="height: 150px; background: rgba(10,10,10,0.8); border-top: 1px solid rgba(255,170,0,0.1); padding: 20px;">
                <div style="color: var(--col-accent); font-size: 10px; margin-bottom: 10px;">WORLD_DATA_STREAM</div>
                <div style="color: var(--col-parchment); font-size: 14px; line-height: 1.4;">
                    The dust motes dance in the flickering light of the ancient terminals.
                    Silence hangs heavy here, broken only by the faint hum of the Global Weave.
                </div>
            </div>
        </div>
    </template>
</div>
