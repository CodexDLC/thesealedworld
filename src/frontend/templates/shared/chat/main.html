<div class="chat-inner-wrap"
     id="chat"
     style="display: flex; flex-direction: column; height: 100%; width: 100%;"
>
    <!-- ── TAB BAR (always shows labels — font small enough for collapsed state) ── -->
    <div class="chat-tabs" :class="{'chat-tabs-mini': chatStep === 0}">

        <!-- Full tab labels — hidden by CSS when .chat-tabs-mini -->
        <div class="chat-tab-group">
            <!-- Static channels -->
            <div class="chat-tab" data-channel="world"  :class="{ 'active': chatTab === 'world' }"  @click="chatTab = 'world'"><span>[WORLD]</span></div>
            <div class="chat-tab" data-channel="local"  :class="{ 'active': chatTab === 'local' }"  @click="chatTab = 'local'"><span>[LOCAL]</span></div>
            <div class="chat-tab" data-channel="system" :class="{ 'active': chatTab === 'system' }" @click="chatTab = 'system'"><span>[SYSTEM]</span></div>

            <!-- Divider between channels and private DMs -->
            <div class="chat-tab-divider"></div>

            <!-- Demo private DM tab — dynamic tabs like this added via Alpine/HTMX -->
            <div class="chat-tab is-private unread" data-channel="private" :class="{ 'active': chatTab === 'dm_rook' }" @click="chatTab = 'dm_rook'">
                <span>@Rook-7</span>
            </div>
        </div>

        <!-- Step controls — always visible -->
        <div class="chat-win-controls">
            <button class="btn-node sm ghost" @click="stepChatSize(-1)" :disabled="chatStep === 0" title="Collapse one step">▼</button>
            <div class="chat-step-track">
                <div class="chat-step-dot" :class="{'active': chatStep === 0}" @click="setChatStep(0)" title="Collapse"></div>
                <div class="chat-step-dot" :class="{'active': chatStep === 1}" @click="setChatStep(1)" title="Quarter"></div>
                <div class="chat-step-dot" :class="{'active': chatStep === 2}" @click="setChatStep(2)" title="Half"></div>
                <div class="chat-step-dot" :class="{'active': chatStep === 3}" @click="setChatStep(3)" title="Full"></div>
            </div>
            <button class="btn-node sm ghost" @click="stepChatSize(1)" :disabled="chatStep === 3" title="Expand one step">▲</button>

            <!-- Smart MIN/MAX toggle — collapses when open, maximizes when collapsed -->
            <button class="btn-node sm"
                    @click="chatStep === 0 ? stepChatSize('max') : stepChatSize('min')"
                    x-text="chatStep === 0 ? 'MAX' : 'MIN'"
                    title="Toggle min/max"></button>
        </div>
    </div>

    <!-- ── COLLAPSED MINI-PREVIEW (step 0 only) ── -->
    <div class="chat-mini-preview" x-show="chatStep === 0" x-transition:enter.duration.200ms x-transition:leave.duration.100ms>
        <div class="msg sys"><span class="tag-m">SYSTEM</span>Connected to Global Weave.</div>
        <div class="msg player"><span class="tag-m">ROOK</span>Has anyone found the sector 7-B entrance?</div>
    </div>

    <!-- ── MAIN CHAT AREA (step 1-3 only) ── -->
    <div class="chat-main-area" x-show="chatStep > 0" style="flex: 1; min-height: 0;">
        <div class="chat-log" id="chat-log"
             x-data="{
                isDragging: false,
                startY: 0,
                scrollTop: 0,
                startDrag(e) {
                    this.isDragging = true;
                    this.startY = e.pageY - $el.offsetTop;
                    this.scrollTop = $el.scrollTop;
                    $el.style.cursor = 'grabbing';
                    $el.style.userSelect = 'none';
                },
                stopDrag() {
                    this.isDragging = false;
                    $el.style.cursor = 'grab';
                    $el.style.userSelect = 'auto';
                },
                doDrag(e) {
                    if (!this.isDragging) return;
                    e.preventDefault();
                    const y = e.pageY - $el.offsetTop;
                    const walk = (y - this.startY) * 1.5;
                    $el.scrollTop = this.scrollTop - walk;
                }
             }"
             @mousedown="startDrag($event)"
             @mousemove="doDrag($event)"
             @mouseup="stopDrag()"
             @mouseleave="stopDrag()"
             style="cursor: grab;"
        >
            <!-- WORLD CHANNEL -->
            <template x-if="chatTab === 'world'">
                <div style="padding: 10px;">
                    <div class="msg sys"><span class="tag-m">SYSTEM</span>Connected to Global Weave.</div>
                    <div class="msg player"><span class="tag-m">ROOK</span>Has anyone found the sector 7-B entrance?</div>
                </div>
            </template>

            <!-- LOCAL CHANNEL -->
            <template x-if="chatTab === 'local'">
                <div style="padding: 10px;">
                    <div class="msg npc"><span class="tag-m">ARCHIVIST</span>The weave is thinning there, Rook. Tread lightly.</div>
                </div>
            </template>

            <!-- SYSTEM CHANNEL -->
            <template x-if="chatTab === 'system'">
                <div style="padding: 10px;">
                    <div class="msg sys"><span class="tag-m">CORE</span>Neural link stable. Latency: 24ms.</div>
                </div>
            </template>
        </div>

        <!-- Characters Zone -->
        <div class="chat-users" id="chat-users">
            <div class="users-header">LOC_AGENTS (3)</div>
            <div class="user-item online" data-tippy-content="Level 12 Archivist">
                <div class="u-dot"></div> <span>Rook-7</span>
            </div>
            <div class="user-item online" data-tippy-content="Level 8 Phase-Runner">
                <div class="u-dot"></div> <span>Veil-4</span>
            </div>
            <div class="user-item" data-tippy-content="Offline / Last seen 2h ago">
                <div class="u-dot gray"></div> <span style="opacity: 0.5">Ghost_01</span>
            </div>
        </div>
    </div>

    <!-- ── INPUT ROW (hidden on step 0, hover-reveal on step 1, always on 2-3) ── -->
    <div class="chat-input-row" id="chat-input-row">
        <span id="chat-prompt">&gt;</span>
        <input id="chat-input" type="text" :placeholder="'Transmit to ' + chatTab + '...'" spellcheck="false" autocomplete="off">
        <button id="chat-send" class="btn-node sm ghost" style="padding: 0 15px; height: 24px; font-size: 8px;">TRANSMIT</button>
    </div>
</div>
