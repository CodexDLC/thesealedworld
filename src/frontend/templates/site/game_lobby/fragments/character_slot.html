<article
    class="lobby-slot {% if slot.is_empty %}lobby-slot--empty{% endif %}"
    :class="{ 'is-selected': selectedSlot === {{ slot.index }} }"
    aria-label="Character slot {{ slot.index }}"
    @click='
        selectedSlot = {{ slot.index }};
        selectedEmpty = {{ 'true' if slot.is_empty else 'false' }};
        selectedCharacterId = {{ (slot.character_id or "") | tojson }};
        selectedName = {{ (slot.name or "") | tojson }};
    '
>
    <div class="lobby-avatar {% if slot.is_empty %}lobby-avatar--empty{% endif %}">
        {% if slot.avatar_url %}
            <img src="{{ slot.avatar_url }}" alt="{{ slot.name }}">
        {% elif slot.is_empty %}
            <span class="lobby-empty-portal"
                  style="--lobby-empty-portal-url: url('/static/images/ui/lobby/threshold-portal.svg')"
                  aria-hidden="true"></span>
            <span class="lobby-empty-prompt">Выберите слот для новой истории</span>
        {% endif %}
        {% if not slot.avatar_url and not slot.is_empty %}
            <div class="lobby-silhouette" aria-hidden="true"></div>
        {% endif %}
        <div class="lobby-avatar-corner lobby-avatar-corner--name">
            {{ slot.name }}
        </div>
        <div class="lobby-avatar-corner lobby-avatar-corner--status">
            {{ slot.status }}
        </div>
        {% if not slot.is_empty %}
            <div class="lobby-presence lobby-presence--{{ slot.presence_class }}">
                {{ slot.presence_label }}
            </div>
        {% endif %}
    </div>
</article>
