<div class="lobby-modal-backdrop" role="presentation">
    <a class="lobby-modal-scrim" href="/" aria-label="Закрыть лобби"></a>
    <section class="lobby-modal" role="dialog" aria-modal="true" aria-labelledby="lobby-modal-title">
        <a class="lobby-modal-close" href="/" aria-label="Закрыть лобби">
            <span aria-hidden="true">×</span>
        </a>
        {% if lobby_notice == "session_replaced" %}
            <div class="login-notice" role="status">
                <strong>Сессия передана другому устройству</strong>
                Эта вкладка отключена. Чтобы продолжить здесь, выберите персонажа снова.
            </div>
        {% endif %}
        {% include "site/game_lobby/fragments/lobby_panel.html" %}
    </section>
</div>
