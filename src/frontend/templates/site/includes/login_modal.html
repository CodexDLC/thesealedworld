<div
    class="auth-modal-backdrop"
    x-show="authModal"
    x-cloak
    x-transition.opacity.duration.180ms
    @click.self="authModal = null"
    @keydown.escape.window="authModal = null"
    role="presentation"
>
    <section class="auth-modal" role="dialog" aria-modal="true" aria-labelledby="client-auth-modal-title">
        <button type="button" class="auth-modal-close" @click="authModal = null" aria-label="Закрыть окно входа">
            <span aria-hidden="true">×</span>
        </button>

        <div class="page-login page-login--modal" x-show="authModal === 'login'" x-cloak>
            <div class="login-container">
                <div class="login-header">
                    <div class="login-title" id="client-auth-modal-title">THE BOND: RESONANCE</div>
                    <div class="login-subtitle">Awaken the connection to the Rift</div>
                </div>

                <form action="/login" method="post" class="login-form">
                    <div class="form-group">
                        <label for="modal-email">SOUL_IDENTIFIER</label>
                        <input type="email" id="modal-email" name="email" placeholder="essence@void.link" required>
                    </div>
                    <div class="form-group">
                        <label for="modal-password">RESONANCE_KEY</label>
                        <input type="password" id="modal-password" name="password" placeholder="••••••••" required>
                    </div>

                    <div class="login-actions">
                        <button type="submit" class="act-btn login-btn">
                            <span>AWAKEN_BOND</span>
                        </button>
                    </div>
                </form>

                <div class="login-footer">
                    <a href="#">Восстановить пароль</a> // <button type="button" @click="authModal = 'register'">Зарегистрироваться</button>
                </div>
            </div>
        </div>

        <div class="page-login page-login--modal" x-show="authModal === 'register'" x-cloak>
            <div class="login-container">
                <div class="login-header">
                    <div class="login-title">THE BOND: INITIALIZATION</div>
                    <div class="login-subtitle">Seek the shadow within the Rift</div>
                </div>

                <form action="/register" method="post" class="login-form">
                    <div class="form-group">
                        <label for="modal-register-email">SOUL_IDENTIFIER</label>
                        <input type="email" id="modal-register-email" name="email" placeholder="essence@void.link" required>
                    </div>
                    <div class="form-group">
                        <label for="modal-register-password">RESONANCE_KEY</label>
                        <input type="password" id="modal-register-password" name="password" placeholder="••••••••" required>
                    </div>
                    <div class="form-group">
                        <label for="modal-register-password-confirm">CONFIRM_RESONANCE</label>
                        <input type="password" id="modal-register-password-confirm" name="password_confirm" placeholder="••••••••" required>
                    </div>

                    <div class="login-actions">
                        <button type="submit" class="act-btn login-btn">
                            <span>ESTABLISH_BOND</span>
                        </button>
                    </div>
                </form>

                <div class="login-footer">
                    <button type="button" @click="authModal = 'login'">Уже есть аккаунт? Войти</button>
                </div>
            </div>
        </div>
    </section>
</div>
